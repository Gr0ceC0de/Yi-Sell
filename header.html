<style>

#ys-header {

.ys-box {
    max-width: 1400px; width: 100%; margin: 0 auto;

    box-shadow: 0 4px 20px rgba(0,0,0,0.04); /* Sombra muy sutil para dar profundidad */

/* ---------- BOX 1 : MOSAICO (FONDO ROSA MATE) ---------- */
.ys-box-mosaico { 
    padding: 28px 10px 24px; 
    background: #fff5f7; /* Rosa mate muy claro */
    border: 1px solid #fce4e8;
}
.ys-box-mosaico h1 {
    font-size: clamp(1.4rem, 5vw, 2.4rem); letter-spacing: 2px; line-height: 1.15;
    margin: 0; text-align: center; font-weight: 700;
    color: #1e1e2f; /* Título oscuro para contraste */

.ys-sub { text-align: center; font-style: italic; color: #666; margin: 8px 0 0; }
.ys-hint-wrap { text-align: center; }
.ys-hint {
    display: inline-block; margin-top: 14px; padding: 6px 14px; border-radius: 999px;
    font-size: 13px; letter-spacing: .5px;
    background: #ffe3a3; border: 1px solid #ffb347; color: #7a4b00;
}
#ys-mosaico {
    font-size: .62rem;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
    gap: 16px 14px; padding: 30px 6px 6px;
}
.ys-card {
    position: relative; display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 12px 18px 8px; min-width: 92px;
    background: #ffffff; /* Fondo blanco para las tarjetas */
    border: 1px solid #f0f0f0; 
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    transition: background .2s, border-color .2s, box-shadow .2s, transform .2s;
    user-select: none;
    animation: ys-entra .6s cubic-bezier(.34,1.56,.64,1) both;
}
.ys-card:hover { 
    background: #fff9fa; 
    border-color: #ffb347; 
    box-shadow: 0 4px 12px rgba(255, 179, 71, 0.15);
    transform: translateY(-2px);
    z-index: 2; 
}
.ys-card.ys-on {
    background: #fff3e0; 
    border-color: #ffb347;
    box-shadow: 0 0 0 2px rgba(255, 179, 71, 0.4), 0 8px 24px rgba(0,0,0,.1); 
    z-index: 3;
}
.ys-saludo { line-height: 1.2; max-width: 24ch; overflow-wrap: anywhere; }
.ys-card.ys-on .ys-saludo { text-shadow: 0 0 10px rgba(255,179,71,0.5); }
.ys-nombre { font-size: .72em; text-transform: uppercase; letter-spacing: 1px; color: #888; margin: 5px 0 2px; }
.ys-iconos { font-size: 1em; letter-spacing: 2px; }
.ys-btn {
    position: absolute; top: -10px; right: -8px; width: 32px; height: 32px; padding: 0;
    border-radius: 999px; display: flex; align-items: center; justify-content: center;
    border: 1px solid #ddd; background: #ffffff; color: #ffb347;
    font-size: 14px; cursor: pointer; z-index: 4; -webkit-tap-highlight-color: transparent;
    transition: transform .2s, background .2s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.ys-btn:hover { transform: scale(1.12); background: #fff9fa; }
.ys-btn.ys-on { background: #ffb347; border-color: #ffb347; color: #ffffff; animation: ys-pulso 1.2s ease-in-out infinite; }
.ys-count { text-align: center; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #999; margin-top: 18px; }

/* ---------- BOX 2 : MARCA (FONDO BLANCO) ---------- */
.ys-box-marca {
    padding: 28px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 22px;
    text-align: left;
    background: #ffffff;
    border: 1px solid #f0f0f0;
}
.ys-logo { width: 96px; height: 96px; flex: none; }
.ys-marca-txt { max-width: 560px; }
.ys-marca-txt h2 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.1rem); letter-spacing: 1px; color: #1e1e2f; }
.ys-marca-txt h2 span { color: #ffb347; }
.ys-marca-txt .ys-en { margin: 2px 0 0; font-style: italic; color: #666; }
.ys-marca-txt p.ys-desc { margin: 12px 0 0; line-height: 1.55; color: #555; font-size: .95rem; }

@keyframes ys-entra { from { opacity: 0; transform: translateY(18px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes ys-pulso { 50% { transform: scale(1.18); } }
@media (max-width: 480px) { #ys-mosaico { font-size: .55rem; } .ys-box-marca { text-align: center; } }
@media (prefers-reduced-motion: reduce) { .ys-card, .ys-btn.ys-on { animation: none; } }

    var YS_FONTS = ["'Montserrat'", "'Playfair Display'", "'Pacifico'", "'Lobster'", "'Caveat'", "'Oswald'", "'Merriweather'", "'Righteous'", "'Bebas Neue'", "'Dancing Script'", "'Abril Fatface'", "'Comfortaa'", "'Special Elite'", "'Cinzel'"];
    var YS_FALLBACK = ", 'Noto Sans', system-ui, sans-serif";

    var voces = [];
    function cargarVoces() {
        if (window.speechSynthesis) voces = window.speechSynthesis.getVoices();
    }
    if (window.speechSynthesis) {
        cargarVoces();
        window.speechSynthesis.onvoiceschanged = cargarVoces;
    }

    function hablar(texto, lang, tarjeta, boton) {
        if (!window.speechSynthesis) {
            alert("Tu navegador no soporta síntesis de voz.");
            return;
        }
        window.speechSynthesis.cancel();

        var u = new SpeechSynthesisUtterance(texto);
        u.lang = lang;
        u.rate = 0.9;

        var base = lang.split('-')[0].toLowerCase();
        var exacta = voces.find(function (v) { return v.lang.replace('_', '-').toLowerCase() === lang.toLowerCase(); });
        var parcial = voces.find(function (v) { return v.lang.toLowerCase().indexOf(base) === 0; });
        if (exacta) u.voice = exacta; else if (parcial) u.voice = parcial;

        document.querySelectorAll('#ys-header .ys-on').forEach(function (el) { el.classList.remove('ys-on'); });
        document.querySelectorAll('#ys-header .ys-btn').forEach(function (b) { b.textContent = '🔊'; });

        tarjeta.classList.add('ys-on');
        boton.classList.add('ys-on');
        boton.textContent = '🔉';

        u.onend = u.onerror = function () {
            tarjeta.classList.remove('ys-on');
            boton.classList.remove('ys-on');
            boton.textContent = '🔊';
        };
        window.speechSynthesis.speak(u);
    }

    function generar() {
        var cont = document.getElementById('ys-mosaico');
        if (!cont) return;

        var lineas = YS_DATA.split('\n')
            .map(function (r) { return r.trim(); })
            .filter(Boolean)
            .map(function (r) { return r.split('|'); });

        var seed = 7;
        function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }

        lineas.forEach(function (f, i) {
            var saludo = f[0], idioma = f[1], iconos = f[2], lang = f[3];
            // Colores más oscuros y saturados para que se lean bien sobre fondo blanco
            var hue = Math.floor((i * 137.5) % 360);
            var saturation = 70 + Math.floor(rnd() * 20); // 70% - 90%
            var lightness = 35 + Math.floor(rnd() * 15);  // 35% - 50% (oscuro)

            var card = document.createElement('div');
            card.className = 'ys-card';
            card.style.animationDelay = ((i * 15) % 600) + 'ms';

            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'ys-btn';
            btn.textContent = '🔊';
            btn.setAttribute('aria-label', 'Escuchar ' + saludo + ' en ' + idioma);

            var dS = document.createElement('div');
            dS.className = 'ys-saludo';
            dS.textContent = saludo;
            dS.style.fontFamily = YS_FONTS[i % YS_FONTS.length] + YS_FALLBACK;
            dS.style.fontSize = (0.9 + rnd() * 0.9).toFixed(2) + 'em';
            // Ajuste de color para fondo claro
            dS.style.color = 'hsl(' + hue + ', ' + saturation + '%, ' + lightness + '%)';

            var dN = document.createElement('div');
            dN.className = 'ys-nombre';
            dN.textContent = idioma;

            var dI = document.createElement('div');
            dI.className = 'ys-iconos';
            dI.textContent = iconos;

            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                hablar(saludo, lang, card, btn);
            });
            card.addEventListener('click', function () { hablar(saludo, lang, card, btn); });

            card.append(btn, dS, dN, dI);
            cont.appendChild(card);
        });

        var c = document.getElementById('ys-count');
        if (c) c.textContent = lineas.length + ' bienvenidas · Web Speech API';
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', generar);
    } else {
        generar();
    }
})();
