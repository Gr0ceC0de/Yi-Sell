.welcome-box{
  position:relative;
  width:100%;
  min-height: 520px;
  background: radial-gradient(circle at center, #ffffff 0%, #e8e8ff 35%, #d6d6ff 100%);
  border-radius: 28px;
  overflow:hidden;
  border: 4px solid #111;
  box-shadow: 0 0 0 6px #fff, 0 20px 60px rgba(0,0,0,0.25), inset 0 4px 10px rgba(255,255,255,0.9);
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 40px 20px;
  isolation:isolate;
}
.welcome-mosaic{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  z-index:0;
}
.welcome-mosaic span{
  position:absolute;
  left:50%; top:50%;
  font-weight:800;
  white-space:nowrap;
  user-select:none;
  will-change: transform;
  opacity:0.9;
  text-shadow: 0 2px 0 rgba(0,0,0,0.1);
  animation: floaty 6s ease-in-out infinite;
}
.welcome-content{
  position:relative;
  z-index:2;
  max-width: 640px;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(12px);
  border: 3px solid #111;
  border-radius: 20px;
  padding: 28px 24px;
  text-align:center;
  box-shadow: 0 12px 30px rgba(0,0,0,0.18);
}
.welcome-badge{
  display:inline-block;
  font-family: Inter, sans-serif;
  font-size:11px;
  letter-spacing:2px;
  background:#111;
  color:#a78bfa;
  padding:6px 12px;
  border-radius:20px;
  margin-bottom:12px;
}
.welcome-content h1{
  font-family: Montserrat, sans-serif;
  font-size: clamp(22px, 4vw, 32px);
  line-height:1.1;
  margin:0 0 10px;
  color:#0f172a;
}
.welcome-content p{

  font-size:14px;
  color:#334155;
  margin:0 0 18px;
}
.welcome-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.btn-primary, .btn-secondary{

  border-radius:12px;

  transition: transform 0.2s;
}
.btn-primary{ background:#111; color:#fff; }
.btn-secondary{ background:#fff; color:#111; }
.btn-primary:hover, .btn-secondary:hover{ transform: translateY(-2px) scale(1.03); }

@keyframes floaty{
  0%,100%{ transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1); }
  50%{ transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1.15); }
}
@keyframes spiralRotate{
  from{ transform: rotate(0deg); }
  to{ transform: rotate(360deg); }
}
.welcome-mosaic{ animation: spiralRotate 180s linear infinite; }

const colors = ["#111","#6C5CE7","#8A8ACB","#e63946","#2563eb","#0f172a","#7B8CDE","#A78BFA","#c19a6b","#d946ef"];
const fonts = ["Montserrat","Inter","'Noto Sans JP'","'Noto Serif Georgian'","'Courier New'","Georgia","Impact","Verdana"];

welcomes.forEach((w,i)=>{
  const el = document.createElement('span');
  el.textContent = w.t;
  el.title = w.l;
  
  const angle = i * 0.55; // espiral
  const radius = Math.pow(i, 0.92) * 6.5;
  const x = Math.cos(angle) * radius;
  const y = Math.sin(angle) * radius;
  
  const size = 10 + (i % 7) * 3 + Math.random()*8; // tamaños variados
  const rot = (Math.random()*80 - 40) + (angle*12);
  
  el.style.setProperty('--x', x+'px');
  el.style.setProperty('--y', y+'px');
  el.style.setProperty('--r', rot+'deg');
  el.style.left = '50%';
  el.style.top = '50%';
  el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
  el.style.fontSize = size+'px';
  el.style.color = colors[i % colors.length];
  el.style.fontFamily = fonts[i % fonts.length];
  el.style.animationDelay = (i*0.05)+'s';
  el.style.zIndex = 100 - i;
  if(i < 5) { el.style.fontSize = '28px'; el.style.background='#111'; el.style.color='#fff'; el.style.padding='2px 8px'; el.style.borderRadius='8px'; }
