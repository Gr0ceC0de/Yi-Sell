const FONTS = ["'Montserrat'","'Playfair Display'","'Pacifico'","'Lobster'","'Caveat'","'Oswald'","'Merriweather'","'Righteous'","'Bebas Neue'","'Dancing Script'","'Abril Fatface'","'Comfortaa'","'Special Elite'","'Cinzel'"];
const FALLBACK = ", 'Noto Sans', system-ui, sans-serif";

// --- SONIDO: voz del navegador (Web Speech API) ---
let voces = [];
function cargarVoces() { voces = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) { cargarVoces(); speechSynthesis.onvoiceschanged = cargarVoces; }

function hablar(texto, lang, tarjeta) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = lang;
  const base = lang.split('-')[0].toLowerCase();
  const voz = voces.find(v => v.lang.replace('_','-').toLowerCase() === lang.toLowerCase())
           || voces.find(v => v.lang.toLowerCase().startsWith(base));
  if (voz) u.voice = voz;
  u.rate = 0.85;
  document.querySelectorAll('.sonando').forEach(x => x.classList.remove('sonando'));
  tarjeta.classList.add('sonando');
  u.onend = u.onerror = () => tarjeta.classList.remove('sonando');
  speechSynthesis.speak(u);
}

function generarMosaico() {
  const box = document.getElementById('mosaico');
  const rows = DATA.split('\n').map(r => r.trim()).filter(Boolean).map(r => r.split('|'));
  let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  rows.forEach(([t, l, ic, lang], i) => {
    const hue = Math.floor((i * 137.5) % 360);
    const d = document.createElement('div');
    d.className = 'tarjeta-idioma';
    const s = document.createElement('div');
    s.className = 'saludo';
    s.textContent = t;
    s.style.fontFamily = FONTS[i % FONTS.length] + FALLBACK;
    s.style.fontSize = (0.9 + rnd() * 1.0).toFixed(2) + 'em';
    s.style.color = `hsl(${hue},85%,72%)`;
    const n = document.createElement('div');
    n.className = 'idioma-nombre';
    n.textContent = l;
    const e = document.createElement('div');
    e.className = 'iconos';
    e.textContent = ic;
    d.addEventListener('click', () => hablar(t, lang, d));
    d.append(s, n, e);
    box.appendChild(d);
  });
  console.log('Mosaico generado con ' + rows.length + ' idiomas.');
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', generarMosaico);
} else {
  generarMosaico();
}
