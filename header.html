    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:ital,wght@1,700&family=Pacifico&family=Lobster&family=Caveat:wght@700&family=Oswald:wght@500&family=Merriweather:wght@700&family=Righteous&family=Bebas+Neue&family=Dancing+Script:wght@700&family=Abril+Fatface&family=Comfortaa:wght@700&family=Special+Elite&family=Cinzel:wght@700&display=swap" rel="stylesheet">

    <!-- Estilos CSS -->
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body { background: #1e1e2f; overflow-x: hidden; }

        .header-mosaico {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);

            padding: 2.5rem 1rem 2rem;
            text-align: center;
            border-bottom: 4px solid #ffb347;

        }
        .header-mosaico::before {
            content: ""; position: absolute; inset: 0;
            background: radial-gradient(600px at 50% -20%, rgba(255, 179, 71, .15), transparent 60%);
            pointer-events: none;
        }
        .header-mosaico h1 {
            position: relative;

            font-size: clamp(1.5rem, 5vw, 2.5rem);

        }
        .header-mosaico .sub {
            position: relative;

            opacity: .9; margin: 8px 0 0; font-style: italic;

        }

            position: relative;

            margin-top: 16px; padding: 6px 14px; border-radius: 999px;
            font-family: 'Montserrat', sans-serif; font-size: 13px; letter-spacing: .5px;
            background: rgba(255, 179, 71, .12); border: 1px solid rgba(255, 179, 71, .25); color: #ffe3a3;
            animation: fadeDown .8s .3s ease both;
        }
        .mosaico-container {
            font-size: .6rem;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
            gap: 12px 14px; max-width: 1400px; margin: 0 auto;
            padding: 32px 10px 40px;

            min-width: 0;
        }
        .tarjeta-idioma {
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
            padding: 10px 12px 8px; min-width: 92px; max-width: 220px;
            background: rgba(255, 255, 255, .03);
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: 12px;
            transition: background .2s, border-color .2s, box-shadow .2s;
            user-select: none;
            opacity: 0;
            transform: translateY(20px) scale(.92);
            will-change: transform;
            overflow: hidden;
            word-wrap: break-word;
            animation: entraMosaico .7s cubic-bezier(.34, 1.56, .64, 1) forwards;
        }
        .tarjeta-idioma:hover {
            background: rgba(255, 255, 255, .07);
            border-color: rgba(255, 179, 71, .25);
            z-index: 2;
        }
        .tarjeta-idioma.sonando {
            background: rgba(255, 179, 71, .15) !important;
            border-color: rgba(255, 179, 71, .6) !important;
            box-shadow: 0 0 0 1px rgba(255, 179, 71, .3), 0 12px 32px rgba(0, 0, 0, .45);
            z-index: 3;
        }
        .tarjeta-idioma.sonando .saludo { 
            text-shadow: 0 0 12px currentColor, 0 0 28px currentColor; 
        }
        .tarjeta-idioma .saludo {
            line-height: 1.15; word-break: break-word; max-width: 22ch; padding: 0 2px;
            transition: text-shadow .25s ease;
        }
        .tarjeta-idioma .idioma-nombre {
            font: 400 .70em 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 1px;
            opacity: .7; color: #ffe3a3; margin: 4px 0 2px;
        }
        .tarjeta-idioma .iconos {
            font-size: 1em; letter-spacing: 2px; opacity: .9; transition: transform .3s ease;
        }
        .tarjeta-idioma:hover .iconos { 
            transform: scale(1.15) rotate(2deg); 
        }

        .btn-voz {
            position: absolute; top: -8px; right: -8px; width: 32px; height: 32px; min-width: 32px; min-height: 32px;
            border-radius: 999px; display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255, 255, 255, .15); background: rgba(30, 30, 47, .92); color: #ffe3a3;
            font-size: 14px; cursor: pointer; transition: all .2s ease; -webkit-tap-highlight-color: transparent;
            z-index: 4;
        }
        .btn-voz:hover { 
            transform: scale(1.12); box-shadow: 0 4px 12px rgba(0, 0, 0, .3); 
        }
        .btn-voz.sonando {
            background: #ffb347; border-color: #ffb347; color: #1e1e2f;
            animation: pulseBtn 1.2s ease-in-out infinite; box-shadow: 0 0 0 4px rgba(255, 179, 71, .25);
        }

        .footer-meta {
            width: 100%; text-align: center; padding: 0 0 36px; font-family: 'Montserrat', sans-serif;
            font-size: 11px; letter-spacing: 2px; text-transform: uppercase; opacity: .3; color: #fff;
        }

        /* ANIMACIONES */
        @keyframes fadeDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes entraMosaico { from { opacity: 0; transform: translateY(22px) scale(.88); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
        @keyframes brillo { 0% { box-shadow: 0 0 0 0 rgba(255, 179, 71, 0); } 50% { box-shadow: 0 0 0 8px rgba(255, 179, 71, .18); } 100% { box-shadow: 0 0 0 0 rgba(255, 179, 71, 0); } }
        .brillo { animation: brillo 1s ease; }

        @media (min-width: 1200px) { .mosaico-container { font-size: .65rem; } }
        @media (max-width: 768px) { .mosaico-container { font-size: .55rem; gap: 10px; } }
        @media (max-width: 480px) { .mosaico-container { font-size: .5rem; gap: 8px; } .tarjeta-idioma { min-width: 80px; } }
    </style>

    const FONTS = ["'Montserrat'", "'Playfair Display'", "'Pacifico'", "'Lobster'", "'Caveat'", "'Oswald'", "'Merriweather'", "'Righteous'", "'Bebas Neue'", "'Dancing Script'", "'Abril Fatface'", "'Comfortaa'", "'Special Elite'", "'Cinzel'"];
    const FALLBACK = ", 'Noto Sans', system-ui, sans-serif";

    // ==========================================
    // 2. GESTIÓN DE VOCES Y REPRODUCCIÓN
    // ==========================================
    let vocesDisponibles = [];

    function actualizarVoces() {
        if (window.speechSynthesis) {
            vocesDisponibles = window.speechSynthesis.getVoices();
        }
    }

    if (window.speechSynthesis) {
        actualizarVoces();
        window.speechSynthesis.onvoiceschanged = actualizarVoces;
    }

    function hablar(texto, lang, tarjeta, boton) {
        if (!window.speechSynthesis) {
            alert("Tu navegador no soporta síntesis de voz.");
            return;
        }

        // Detener cualquier audio previo en curso
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = lang;
        utterance.rate = 0.9; // Velocidad ligeramente más natural y clara

        // Búsqueda inteligente de la voz correspondiente
        const baseLang = lang.split('-')[0].toLowerCase();
        const vozExacta = vocesDisponibles.find(v => v.lang.replace('_', '-').toLowerCase() === lang.toLowerCase());
        const vozBase = vocesDisponibles.find(v => v.lang.toLowerCase().startsWith(baseLang));

        if (vozExacta) {
            utterance.voice = vozExacta;
        } else if (vozBase) {
            utterance.voice = vozBase;
        }

        // Limpiar estados previos visuales
        document.querySelectorAll('.sonando').forEach(el => el.classList.remove('sonando'));
        document.querySelectorAll('.btn-voz').forEach(b => b.textContent = '🔊');

        // Activar estados visuales actuales
        tarjeta.classList.add('sonando');
        boton.classList.add('sonando');
        boton.textContent = '🔉';

        // Eventos de control de reproducción
        utterance.onend = utterance.onerror = () => {
            tarjeta.classList.remove('sonando');
            boton.classList.remove('sonando');
            boton.textContent = '🔊';
        };

        // Ejecutar voz
        window.speechSynthesis.speak(utterance);
    }

    // ==========================================
    // 3. GENERACIÓN DEL MOSAICO DE TARJETAS
    // ==========================================
    function generarMosaico() {
        const contenedor = document.getElementById('mosaico');
        if (!contenedor) return;

        const lineas = DATA.split('\n').map(r => r.trim()).filter(Boolean).map(r => r.split('|'));

        let seed = 7;
        const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

        lineas.forEach(([textoSaludo, nombreIdioma, iconos, codigoLang], i) => {
            const hue = Math.floor((i * 137.5) % 360);
            const tarjeta = document.createElement('div');
            tarjeta.className = 'tarjeta-idioma';

            // Retraso escalonado para la aparición inicial
            const delayEntrada = (i * 15) % 600;
            tarjeta.style.animationDelay = `${delayEntrada}ms`;

            // Botón de voz interactivo
            const botonVoz = document.createElement('button');
            botonVoz.className = 'btn-voz';
            botonVoz.textContent = '🔊';
            botonVoz.setAttribute('aria-label', `Escuchar ${textoSaludo} en ${nombreIdioma}`);

            // Contenido textual y visual de la tarjeta
            const divSaludo = document.createElement('div');
            divSaludo.className = 'saludo';
            divSaludo.textContent = textoSaludo;
            divSaludo.style.fontFamily = FONTS[i % FONTS.length] + FALLBACK;
            divSaludo.style.fontSize = (0.9 + rnd() * 0.9).toFixed(2) + 'em';
            divSaludo.style.color = `hsl(${hue}, 85%, 72%)`;

            const divNombre = document.createElement('div');
            divNombre.className = 'idioma-nombre';
            divNombre.textContent = nombreIdioma;

            const divIconos = document.createElement('div');
            divIconos.className = 'iconos';
            divIconos.textContent = iconos;

            // Asignación limpia del evento click
            botonVoz.addEventListener('click', (e) => {
                e.stopPropagation();
                hablar(textoSaludo, codigoLang, tarjeta, botonVoz);
            });

            tarjeta.append(botonVoz, divSaludo, divNombre, divIconos);
            contenedor.appendChild(tarjeta);
        });

        // Efecto visual sutil y aleatorio de brillo periódico
        setInterval(() => {
            const tarjetas = document.querySelectorAll('.tarjeta-idioma');
            if (!tarjetas.length) return;
            const tarjetaAleatoria = tarjetas[Math.floor(Math.random() * tarjetas.length)];
            tarjetaAleatoria.classList.add('brillo');
            setTimeout(() => tarjetaAleatoria.classList.remove('brillo'), 1000);
        }, 3000);

        console.log('Mosaico de 101 idiomas cargado y listo con soporte de voz interactivo.');
    }

    // Inicializar al cargar el DOM
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', generarMosaico);
    } else {
        generarMosaico();
    }
</script>
