<table>

<style>
@import url('https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap');

.table-wrapper {
  --bg: #15131b;
  --celda: #252131;         /* gris violeta oscuro */
  --celda-2: #2e2940;       /* un poco más claro para rayado */
  --celda-pais: #1d1a29;
  --borde: #3d3852;
  --borde-brillante: #6b6588;
  --texto: #e9e6f0;         /* blanco violeta gris */
  --texto-suave: #a9a6b8;   /* gris violeta */
  --fucsia: #ff5ca1;
  --fucsia-claro: #ff8fc0;
  --fucsia-acuarela: #ff3d9a;
  max-width: 1150px;
  margin: 2rem auto;
  padding: 0;
  overflow-x: auto;
  background: var(--bg);
  border-radius: 2px;
}

.subtitle {
  font-family: "Old Standard TT", Georgia, serif;
  font-style: italic;
  text-align: center;
  color: var(--texto-suave);
  letter-spacing: 0.04em;
  font-size: 15px;
  margin-bottom: 1.2rem;
}

.table-wrapper table {
  width: 100%;
  border-collapse: collapse;
  font-family: "Old Standard TT", Georgia, serif;
  background: var(--celda);
  border: 1px solid var(--borde);
  box-shadow: 
    inset 0 0 0 1px rgba(255,255,255,0.05),
    0 12px 40px rgba(0,0,0,0.6);
}

/* CABECERA - tipo The Times, pequeña y seria */
.table-wrapper th {
  font-family: "Old Standard TT", serif;
  background: #0f0e14;
  color: var(--texto-suave);
  border-bottom: 1px solid var(--borde);
  border-right: 1px solid #1e1c29;
  padding: 10px 18px;
  text-align: left;
  font-size: 11px;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.18em;
}

/* CELDAS BASE - fondo oscuro */
.table-wrapper td {
  background: var(--celda);
  color: var(--texto);
  border-bottom: 1px solid #2a2738;
  border-right: 1px solid #2a2738;
  padding: 22px 20px;
  vertical-align: top;
  font-size: 15.5px;
  line-height: 1.75;
  white-space: pre-line;
  transition: background 0.2s ease;
}

.table-wrapper tr:nth-child(even) td {
  background: var(--celda-2);
}

/* EFECTO BORDE BRILLANTE AL HOVER - invita a leer */
.table-wrapper tr:hover td {
  background: #33304a;
  box-shadow: inset 0 0 0 1px rgba(255, 92, 161, 0.15);
}

/* COLUMNA PAIS - sello de imprenta */
.table-wrapper td.country {
  width: 110px;
  background: var(--celda-pais);
  text-align: center;
  font-family: "Playfair Display", serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--texto-suave);
  border-right: 1px solid var(--borde);
  white-space: normal;
}
.table-wrapper td.country span {
  display: block;
  font-size: 2.1rem;
  line-height: 1.1;
  margin-bottom: 6px;
  filter: saturate(0.8) brightness(1.1);
}

/* COLUMNA TITULAR - EL CORAZÓN - FUCSIA ACUARELA */
.table-wrapper td.headline {
  width: 62%;
  font-family: "Playfair Display", serif;
  font-weight: 700;
  font-size: 20px;
  line-height: 1.35;
  letter-spacing: -0.01em;
  /* Efecto acuarela fucsia */
  color: transparent;
  background: linear-gradient(100deg, var(--fucsia) 10%, var(--fucsia-claro) 40%, #ffb3d6 55%, var(--fucsia-acuarela) 80%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 12px rgba(255, 61, 154, 0.35)) drop-shadow(0 1px 0 rgba(255,255,255,0.8));
  /* Borde brillante blanco-violeta de la letra */
  text-shadow: none;
  position: relative;
}

/* Sub-texto dentro del headline si lo tienes */
.table-wrapper td.headline::first-line {
  font-size: 22px;
}

/* Para que el texto largo siga legible, el resto en blanco violeta */
.table-wrapper td.headline {
  /* truco: si el texto es largo, solo el título brilla, el resto se apaga */
  -webkit-text-fill-color: var(--texto);
  background: none;
}
.table-wrapper td.headline::first-line,
.table-wrapper td.headline strong,
.table-wrapper td.headline b {
  background: linear-gradient(100deg, var(--fucsia) 0%, var(--fucsia-claro) 50%, #ffd1e6 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 10px rgba(255, 92, 161, 0.4));
}

/* COLUMNA FUENTES - pequeña, como nota al pie de imprenta */
.table-wrapper td:last-child {
  font-family: "Old Standard TT", serif;
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--texto-suave);
  overflow-wrap: anywhere;
  font-style: italic;
}

.table-wrapper a {
  color: var(--fucsia-claro);
  text-decoration: none;
  border-bottom: 1px dotted rgba(255, 143, 192, 0.4);
  transition: all 0.2s;
}
.table-wrapper a:hover {
  color: #fff;
  border-bottom: 1px solid var(--fucsia);
  text-shadow: 0 0 8px var(--fucsia);
}

/* Móvil */
@media (max-width: 700px) {
  .table-wrapper table, .table-wrapper tbody, .table-wrapper tr, .table-wrapper td {
    display: block;
    width: auto;
  }
  .table-wrapper thead { display: none; }
  .table-wrapper td.country {
    width: auto;
    text-align: left;
    padding: 12px 18px;
    border-bottom: none;
  }
  .table-wrapper td.country span { display: inline; margin-right: .5rem; }
  .table-wrapper td.headline { width: auto; font-size: 19px; }
}
</style>

<td class="headline"> *Germany 2026 Headlines: 
En los últimos meses, Alemania ha mostrado una recuperación económica moderada impulsada por un fuerte estímulo fiscal en infraestructuras y defensa (fondo de unos 500.000 millones de euros), un repunte de las exportaciones ligado a la demanda global de IA y centros de datos, y mejores indicadores de confianza empresarial (índice Ifo al alza). El crecimiento del PIB se revisó al alza hasta alrededor del 1,3 % para 2026. En política, el canciller Friedrich Merz (CDU, coalición con SPD) enfrenta una crisis tras derrotas regionales de septiembre, con avances de la AfD (extrema derecha) y Die Linke; persisten retos estructurales como demografía, precios energéticos (afectados por el conflicto en Oriente Medio) y deuda pública creciente. En tecnología y finanzas destacan inversiones extranjeras (como el plan de 40.000 millones de euros de Emiratos Árabes), impulso a IA/semiconductores, reformas para atraer capital y un próximo “Invest in Germany Summit”. dw.com

En los últimos tres meses (aprox. julio-septiembre 2026), el gobierno de Merz consolidó el “bazooka” fiscal con el fondo especial de infraestructuras y el aumento del gasto en defensa (alrededor de 98.000 millones este año), junto a la ley de futuro de infraestructuras (en vigor desde julio) que acelera permisos. La economía se benefició del auge global de IA (exportaciones de electrónica y demanda de data centers) y de cierta resiliencia ante el shock energético del conflicto en Irán/Oriente Medio. Los institutos económicos y la Bundesbank elevaron previsiones de crecimiento a ~1-1,3 % para 2026 (desde ~0,5-0,6 %). Sin embargo, la inflación subió (hasta ~3,3 % en septiembre por energía), el desempleo volvió a superar los 3 millones y las insolvencias empresariales se mantuvieron altas. Políticamente, las elecciones estatales de septiembre fueron un “desastre” para la CDU: la AfD ganó en Sajonia-Anhalt y Mecklemburgo-Pomerania Occidental (CDU quedó fuera del parlamento en esta última), y Die Linke lideró en Berlín. Merz reafirmó su permanencia y el impulso a reformas (impuestos, pensiones, sanidad, burocracia), pero su popularidad está en mínimos y hay presión para suavizarlas. En tecnología/finanzas: Emiratos anunció ~40.000 millones de inversión en industria, IA, infra digital y energía; se impulsan fondos públicos para movilizar capital privado y hay interés en posicionar a Alemania en IA e industrial tech. delloite.com

Exclusivamente en la última semana (aprox. 28 septiembre – 5 octubre 2026): Merz visitó Kiev, anunció 350 millones de euros de ayuda adicional para el sector energético ucraniano y reiteró el apoyo a Ucrania frente a Rusia. El presidente Steinmeier advirtió sobre riesgos de polarización “estilo Weimar” por desinformación y extremismos. Se celebró el Día de la Unidad Alemana (3 de octubre) en Bremen, con llamados a defender la democracia. Indicadores económicos siguieron positivos (crecimiento revisado al alza por el gobierno y Bundesbank), y el CEO de Deutsche Bank advirtió que los resultados electorales regionales podrían desalentar inversores extranjeros. Se prepara la cumbre de inversión “Invest in Germany” (19-20 octubre) con participación de grandes fondos y tecnológicas. La AfD muestra señales de posible moderación en su postura anti-UE según papeles internos.
