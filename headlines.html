    @font-face {
      font-family: "Optimistic Mono";

      font-weight: 400;
      font-display: swap;
      src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
    }

    /* ==========================================================================
       2. RESETS Y ESTILOS BASE (PÁGINA EN BLANCO)
       ========================================================================== */
    *, ::after, ::before {
      box-sizing: border-box;
      border: 0 solid #e5e7eb;
      margin: 0;
      padding: 0;
    }

    html, body, #root {
      min-height: 100vh;
    }

    body {
      background-color: #ffffff; /* Página en blanco */
      color: #111827;            /* Texto base oscuro */
      font-family: "Optimistic", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    code, pre, kbd, samp {
      font-family: "Optimistic Mono", ui-monospace, monospace;
    }

    /* ==========================================================================
       3. CONTENEDORES Y TARJETAS DE NOTICIAS (FONDO OSCURO)
       ========================================================================== */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    /* Estilo reutilizable para noticias en fondo oscuro */
    .news-card,
    .news-box {
      background-color: #1e1e1e;   /* Fondo oscuro para las noticias */
      color: #f3f4f6;              /* Texto claro de alto contraste */
      border: 1px solid #2d2d2d;
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .news-card:hover,
    .news-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .news-card h1, 
    .news-card h2, 
    .news-card h3,
    .news-box h1, 
    .news-box h2, 
    .news-box h3 {
      color: #ffffff;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .news-card p,
    .news-box p {
      color: #d1d5db;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .news-meta {
      color: #9ca3af;
      font-size: 0.8rem;
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #374151;
      padding-top: 0.75rem;
    }
  </style>
