<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Technology, Fintech & Crypto Headlines</title>
<meta name="description" content="Quarterly global headlines covering technology, fintech, cryptocurrencies, digital banking, AI, financial markets, and innovation.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #15131b;
    --paper: #1c1a26;
    --celda: #252131;
    --celda-2: #2e2940;
    --celda-pais: #1d1a29;
    --borde: #3d3852;
    --texto: #e9e6f0;
    --texto-suave: #a9a6b8;
    --fucsia: #ff5ca1;
    --fucsia-claro: #ff8fc0;
  }

    * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--texto);
    font-family: "Old Standard TT", Georgia, serif;
    margin: 0;
    padding: 0 16px 40px;
  }

  /* HEADER NEGRO TIPO CONSOLA - lo que tenias roto */
  .top-bar {
    background: #0f0e14;
    color: #f0f0f0;
    padding: 14px;
    text-align: center;
    font-family: Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.2em;
    border-bottom: 1px solid var(--borde);
  }

  h1.masthead {
    font-family: "Playfair Display", serif;
    font-weight: 900;
    font-size: 32px;
    text-align: center;
    margin: 32px 0 8px;
    color: var(--texto);
    letter-spacing: -0.03em;
  }

  .subtitle {
    font-style: italic;
    text-align: center;
    color: var(--texto-suave);
    letter-spacing: 0.04em;
    font-size: 14px;
    margin-bottom: 2rem;
  }

  .table-wrapper {
    max-width: 1150px;
    margin: 0 auto;
    overflow-x: auto;
  }

  .table-wrapper table {
    width: 100%;
    border-collapse: collapse;
    background: var(--celda);
    border: 1px solid var(--borde);
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }

  .table-wrapper th {
    font-family: "Old Standard TT", serif;
    background: #0f0e14;
    color: var(--texto-suave);
    border-bottom: 1px solid var(--borde);
    padding: 10px 18px;
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 400;
  }

  .table-wrapper td {
    border-bottom: 1px solid #2a2738;
    border-right: 1px solid #2a2738;
    padding: 22px 20px;
    vertical-align: top;
    font-size: 14.5px;
    line-height: 1.7;
    white-space: pre-line;
  }

  .table-wrapper tr:nth-child(even) td { background: var(--celda-2); }
  .table-wrapper tr:hover td { background: #33304a; }

  /* PAIS */
  td.country {
    width: 110px;
    background: var(--celda-pais) !important;
    text-align: center;
    font-family: "Playfair Display", serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--texto-suave);
  }
  td.country span { display: block; font-size: 2rem; margin-bottom: 6px; }

  /* TITULAR - AQUARELA FUCSIA */
  td.headline {
    width: 62%;
    font-family: "Playfair Display", serif;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.35;
    color: var(--texto);
  }
  /* Solo negritas / primera línea en fucsia acuarela */
  td.headline strong, td.headline b, td.headline em:first-child {
    background: linear-gradient(100deg, var(--fucsia) 0%, var(--fucsia-claro) 60%, #ffd1e6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 92, 161, 0.4));
  }

  /* FUENTES */
  td:last-child {
    font-size: 11px;
    line-height: 1.6;
    color: var(--texto-suave);
    font-style: italic;
    overflow-wrap: anywhere;
  }
  .table-wrapper a {
    color: var(--fucsia-claro);
    text-decoration: none;
    border-bottom: 1px dotted rgba(255,143,192,0.4);
  }
  .table-wrapper a:hover { color: #fff; border-bottom-color: var(--fucsia); }

  @media (max-width: 700px) {
    .table-wrapper table, .table-wrapper tbody, .table-wrapper tr, .table-wrapper td { display: block; width: auto; }
    .table-wrapper thead { display: none; }
    td.country { text-align: left; }
    td.country span { display: inline; margin-right: .5rem; }
  }
</style>
</head>
<body>

<div class="top-bar">2026 — QUARTERLY EDITION — GLOBAL TECHNOLOGY, FINTECH & CRYPTO</div>

<h1 class="masthead">Global Headlines</h1>
<p class="subtitle">Most relevant quarterly developments by country</p>

<div class="table-wrapper">
<table>
<thead>
<tr><th>Country</th><th>Top Quarterly Headlines</th><th>Sources</th></tr>
</thead>
<tbody>

</tbody>
</table>
</div>

</body>
</html>
